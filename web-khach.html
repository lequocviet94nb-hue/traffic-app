<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Khách Hàng - Nhiệm Vụ SEO</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 25px; max-width: 650px; margin: auto; line-height: 1.7; color: #334155; }
        .box { border: 2px dashed #0284c7; padding: 25px; text-align: center; border-radius: 12px; background: #f0f9ff; margin-top: 30px; }
        #timer { font-size: 24px; color: #dc2626; font-weight: 800; margin-bottom: 10px; }
        #btn-get { display: none; padding: 12px 26px; background: #16a34a; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: 700; }
        #btn-get:hover { background: #15803d; }
        #result { margin-top: 15px; font-size: 26px; font-weight: 800; color: #d946ef; }
    </style>
</head>
<body>
    <h1>Chúc Mừng Bạn Đã Vượt Link Thành Công! 🎉</h1>
    <p>Bạn đã hoàn thành việc xem liên kết tài trợ. Dưới đây là mã xác nhận phần thưởng của bạn.</p>

    <div class="box">
        <p style="font-weight: 600; margin-top: 0;">Cuộn đọc nội dung và đợi đồng hồ chạy hết để nhận mã xác nhận:</p>
        <div id="timer">Chờ: 10 giây</div>
        <button id="btn-get" onclick="getCode()">BẤM ĐỂ LẤY MÃ</button>
        <div id="result"></div>
    </div>

    <script>
        // Ngay khi vừa mở trang web này lên, tự động báo máy chủ bắt đầu tính giờ
        fetch('/api/web-khach-start', { method: 'POST' }).catch(e => console.log(e));

        let timeLeft = 10;
        let timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = `Chờ: ${timeLeft} giây`;
            if (timeLeft <= 0) {
                clearInterval(timer);
                document.getElementById('timer').style.display = 'none';
                document.getElementById('btn-get').style.display = 'inline-block';
            }
        }, 1000);

        async function getCode() {
            const btn = document.getElementById('btn-get');
            btn.disabled = true;
            btn.innerText = "Đang lấy mã...";

            try {
                let res = await fetch('/api/get-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                let data = await res.json();
                if (data.success && data.code) {
                    document.getElementById('result').innerText = data.code;
                    btn.style.display = 'none';
                } else {
                    alert(data.message || "Lỗi khi lấy mã!");
                    btn.disabled = false;
                    btn.innerText = "BẤM ĐỂ LẤY MÃ";
                }
            } catch (err) {
                alert("Lỗi kết nối máy chủ!");
                btn.disabled = false;
                btn.innerText = "BẤM ĐỂ LẤY MÃ";
            }
        }
    </script>
</body>
</html>
